<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to LearnSphere and access professional courses, quizzes, and progress tracking.">
    <title>LearnSphere | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <main class="auth-panel card">
        <div class="auth-header">
            <p class="eyebrow">Welcome back</p>
            <h1>Login to LearnSphere</h1>
            <p>Access your courses, quizzes, and progress dashboard.</p>
        </div>
        <label>Username</label>
        <input id="loginUsername" placeholder="Username" autocomplete="username">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
        <button onclick="loginUser()">Login</button>
        <p class="auth-footer">Don't have an account? <a href="register.html">Register</a></p>
    </main>
    <script src="script.js"></script>
</body>
</html>
