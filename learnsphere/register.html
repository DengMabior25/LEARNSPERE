<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for LearnSphere to start professional training in web development, data science, and UX.">
    <title>LearnSphere | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <main class="auth-panel card">
        <div class="auth-header">
            <p class="eyebrow">Get started</p>
            <h1>Create your LearnSphere account</h1>
            <p>Sign up and begin your learning journey with professional courses and quizzes.</p>
        </div>
        <form id="registrationForm" onsubmit="registerUser(event)">
            <label for="regEmail">Email</label>
            <input id="regEmail" type="email" placeholder="you@example.com" autocomplete="email" required>
            <label for="regUsername">Username</label>
            <input id="regUsername" placeholder="Username" autocomplete="username" required>
            <label for="regPassword">Password</label>
            <input id="regPassword" type="password" placeholder="Password" autocomplete="new-password" required>
            <button id="registerButton" type="submit">Send confirmation code</button>
        </form>
        <form id="verificationForm" hidden onsubmit="verifyRegistrationCode(event)">
            <p class="form-message">Enter the 6-digit code sent to <strong id="verificationEmail"></strong>.</p>
            <label for="confirmationCode">Confirmation code</label>
            <input id="confirmationCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required>
            <button id="verifyButton" type="submit">Verify email and create account</button>
            <button id="resendButton" type="button" class="ghost-button">Send a new code</button>
            <button type="button" class="ghost-button" onclick="editRegistration()">Change registration details</button>
        </form>
        <p id="registrationMessage" class="form-message" role="status" aria-live="polite"></p>
        <p class="auth-footer">Already have an account? <a href="/login">Login</a></p>
    </main>
    <script src="script.js"></script>
</body>
</html>
