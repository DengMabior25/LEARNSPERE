<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for LearnSphere to start professional training in web development, data science, and UX.">
    <title>LearnSphere | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <main class="auth-panel card">
        <div class="auth-header">
            <p class="eyebrow">Get started</p>
            <h1>Create your LearnSphere account</h1>
            <p>Sign up and begin your learning journey with professional courses and quizzes.</p>
        </div>
        <label>Username</label>
        <input id="regUsername" placeholder="Username" autocomplete="username">
        <label>Password</label>
        <input id="regPassword" type="password" placeholder="Password" autocomplete="new-password">
        <button onclick="registerUser()">Create account</button>
        <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
    </main>
    <script src="script.js"></script>
</body>
</html>
